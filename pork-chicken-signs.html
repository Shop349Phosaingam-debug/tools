 if(d){try{await d.save({filename:'ป้ายราคา.html',data:blob});return}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ป้ายราคา.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function printSigns(){if(!$('#pages .page')){alert('ยังไม่มีป้ายในคิว');return}
 let fr=false;try{fr=window.self!==window.top}catch(e){fr=true}
 if(!fr){try{window.print();return}catch(e){}}
 const w=window.open(URL.createObjectURL(new Blob([pdoc()],{type:'text/html'})),'_blank');
 if(!w){try{window.print();return}catch(e){}alert('เบราว์เซอร์บล็อกหน้าต่างพิมพ์ — อนุญาตป๊อปอัปของเว็บนี้ หรือกด "ดาวน์โหลดไฟล์ป้าย" แล้วเปิดไฟล์เพื่อพิมพ์')}}
$('#dl').onclick=dlSigns;
const OV=(()=>{try{return JSON.parse(localStorage.getItem('ov')||'{}')}catch(e){return{}}})();
D.P.forEach(p=>{p.p1=p.p;p.d1=p.d;p.o1=p.o;p.p0=p.p;p.d0=p.d;p.o0=p.o});const D0DT=D.dt;let IMP=null;try{IMP=JSON.parse(localStorage.getItem('imp')||'null')}catch(e){}
if(IMP&&IMP.base===D0DT&&IMP.m){D.P.forEach(p=>{const v=IMP.m[p.c];if(v){p.p0=v[0];p.o0=v[1];p.d0=v[2]}else p.d0=0});if(IMP.dt)D.dt=IMP.dt}else IMP=null;
const HOLD={until:'2026-10-11',codes:[2400000685,2400000202,2400000060,2400000081,2400000145]};
const TEMP={round:'03 - 09 ต.ค. 69',until:'2026-10-16',prices:{2400000685:103,2400000060:121,2400000062:135,2400000202:151,2400000088:130}};
const holdOn=(u=HOLD.until)=>{const t=new Date(),d=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;return d<=u};
const rf=p=>{const v=OV[p.c];p.p=v!=null?v:p.p0;if(v!=null){p.o=p.p0;p.d=p.p0==null?null:Math.round((v-p.p0)*100)/100}else{p.o=p.o0;p.d=p.d0;if(p.o0!=null&&HOLD.codes.includes(p.c)&&holdOn()){p.p=p.o0;p.d=0}if(TEMP.prices[p.c]!=null&&p.o0!=null&&D.dt===TEMP.round){if(holdOn(TEMP.until)){p.p=TEMP.prices[p.c];p.o=p.o0;p.d=Math.round((p.p-p.o0)*100)/100}else{p.p=p.o0;p.d=0}}}};
D.P.forEach(rf);
const sv=()=>{try{localStorage.setItem('ov',JSON.stringify(OV))}catch(e){}};
function plist(){const q=$('#ps').value.trim().toLowerCase(),c=$('#pcat').value,ch=$('#pchg').checked;return D.P.filter(p=>(!c||p.g===c)&&(!q||p.n.toLowerCase().includes(q)||String(p.c).includes(q))&&(!ch||OV[p.c]!=null))}
function drawP(){const L=plist();$('#pc2').textContent=`แสดง ${L.length} รายการ · แก้ราคาแล้ว ${Object.keys(OV).length} รายการ (ราคาที่แก้จะนำไปใช้กับป้ายทุกแบบ)`;
 $('#pt').innerHTML='<tr><th>รหัส</th><th>ชื่อสินค้า</th><th>ราคาเดิม</th><th>ราคาปัจจุบัน (แก้ได้)</th><th>ส่วนต่าง</th></tr>'+L.map(p=>`<tr class="${OV[p.c]!=null?'ch':''}"><td>${p.c}</td><td>${E(p.n)}</td><td>${p.o??'-'}</td><td><input type="number" step="any" data-ov="${p.c}" value="${p.p??''}" placeholder="-"></td><td>${p.d??''}</td></tr>`).join('')}
['ps','pcat','pchg'].forEach(i=>$('#'+i).addEventListener('input',drawP));
const THM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],pad2=n=>String(n).padStart(2,'0');
function roundLabel(h){const m=String(h||'').match(/(\d{1,2})(?:\.(\d{1,2}))?\s*-\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(!m)return null;const m2=+m[4],m1=m[2]?+m[2]:m2;if(m1<1||m1>12||m2<1||m2>12)return null;let y=+m[5];if(y<100)y+=2000;if(y<2400)y+=543;const yy=String(y).slice(-2),d1=pad2(m[1]),d2=pad2(m[3]);return m1===m2?`${d1} - ${d2} ${THM[m2-1]} ${yy}`:`${d1} ${THM[m1-1]} - ${d2} ${THM[m2-1]} ${yy}`}
const IC={c:3,o:104,n:105,d:106},r2=x=>Math.round(x*100)/100;
function impShow(html,err){$('#impst').style.color=err?'#d6001c':'';$('#impst').innerHTML=html}
const SHR={db:null,cur:null,ts:0,applied:false,confirm:0};
function shNote(){const d=SHR.cur;
 if(d&&d.base===D0DT&&d.m){impShow(`🌐 ใช้ราคาที่ใช้ร่วมกันทุกเครื่อง: <b>${E(d.name||'')}</b>${d.dt?' · รอบ '+E(d.dt):''} <button class="btn g" id="imprs" style="margin-left:8px">↩️ กลับไปใช้ราคาเริ่มต้นของระบบ</button>`)}
 else if(IMP&&SHR.db){impShow(`ใช้ราคาจากไฟล์ที่นำเข้าไว้ (เฉพาะเครื่องนี้): <b>${E(IMP.name)}</b>${IMP.dt?' · รอบ '+E(IMP.dt):''} <button class="btn" id="impsh" style="margin-left:8px">🌐 แชร์ราคานี้ให้ทุกเครื่อง</button> <button class="btn g" id="imprs">↩️ กลับไปใช้ราคาเริ่มต้นของระบบ</button>`)}}
function applyShared(m,dt){D.P.forEach(p=>{p.p0=p.p1;p.o0=p.o1;p.d0=p.d1});D.P.forEach(p=>{const v=m[p.c];if(v){p.p0=v[0];p.o0=v[1];p.d0=v[2];if(OV[p.c]!=null)delete OV[p.c]}else p.d0=0});D.dt=dt||D0DT;S.dt=D.dt;$('#dt').value=D.dt;D.P.forEach(rf);sv();drawP();draw();holdNote()}
function onShared(snap){const d=snap.exists?snap.data():null;SHR.cur=d;
 if(!d||d.base!==D0DT||!d.m){if(SHR.applied&&!d){SHR.applied=false;SHR.ts=0;applyShared(IMP&&IMP.m&&IMP.base===D0DT?IMP.m:{},IMP&&IMP.dt||D0DT);if(!(IMP&&IMP.m))D.P.forEach(p=>{p.d0=p.d1});D.P.forEach(rf);drawP();draw();holdNote()}shNote();return}
 if(SHR.ts===d.ts)return
 if(IMP&&IMP.ts&&IMP.ts>d.ts){shNote();return}
 SHR.ts=d.ts;SHR.applied=true;applyShared(d.m,d.dt);shNote()}
async function doImport(file){
 if(!file)return;
 if(!/\.xls[xmb]?$/i.test(file.name))return impShow('⚠️ ต้องเป็นไฟล์ Excel (.xlsx)',1);
 if(!window.XLSX)return impShow('⚠️ โหลดตัวอ่าน Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ต) ลองรีเฟรชหน้านี้',1);
 impShow('กำลังอ่านไฟล์...');
 let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:'array'})}catch(e){return impShow('⚠️ อ่านไฟล์ไม่ได้: '+E(e.message),1)}
 const hid={};((wb.Workbook&&wb.Workbook.Sheets)||[]).forEach(x=>{hid[x.name]=x.Hidden});
 let names=wb.SheetNames.filter(n=>!hid[n]);const pick=names.filter(n=>n.startsWith('ราคาขาย'));if(pick.length)names=pick;
 const found=new Map(),bad=[];let zone='',label=null;
 for(const sn of names){const ws=wb.Sheets[sn];if(!ws||!ws['!ref'])continue;
  const rg=XLSX.utils.decode_range(ws['!ref']);rg.s.c=0;rg.s.r=0;
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,range:XLSX.utils.encode_range(rg)});
  const hi=rows.findIndex(x=>x&&String(x[IC.c]||'').includes('รหัสสินค้า'));if(hi<0)continue;
  const hn=String(rows[hi][IC.n]||'');if(!hn.includes('รอบ')){bad.push(`${sn}: หัวคอลัมน์ DB คือ "${hn}"`);continue}
  const z=rows[hi-1]&&rows[hi-1][IC.o];if(z&&!zone)zone=String(z).trim();if(!label)label=roundLabel(hn);
  for(let i=hi+1;i<rows.length;i++){const x=rows[i];if(!x)continue;const c=Number(x[IC.c]);if(!(c>=1e9))continue;const db=x[IC.n];if(typeof db!=='number')continue;
   found.set(c,{db,da:typeof x[IC.o]==='number'?x[IC.o]:null,dc:typeof x[IC.d]==='number'?x[IC.d]:null,name:String(x[4]||'').trim()})}}
 if(!found.size)return impShow('⚠️ ไม่พบข้อมูลราคาที่อ่านได้'+(bad.length?' ('+E(bad.join(' · '))+')':' — ต้องมีชีตที่คอลัมน์ D เป็นรหัสสินค้า และคอลัมน์ DB เป็นราคารอบใหม่'),1);
 D.P.forEach(p=>{p.p0=p.p1;p.o0=p.o1;p.d0=0});
 const m={},changed=[],miss=[];let cleared=0;
 D.P.forEach(p=>{const v=found.get(p.c);if(!v)return;const prev=p.p1;
  const o=v.da!=null?v.da:p.o1,d=v.dc!=null?v.dc:(v.da!=null?r2(v.db-v.da):0);
  p.p0=v.db;p.o0=o;p.d0=d;m[p.c]=[v.db,o,d];if(prev!==v.db)changed.push({p,prev,db:v.db});
  if(OV[p.c]!=null){delete OV[p.c];cleared++}});
 const have=new Set(D.P.map(p=>p.c));found.forEach((v,c)=>{if(!have.has(c))miss.push({c,name:v.name,db:v.db})});
 const notIn=D.P.filter(p=>!found.has(p.c)).length;
 D.P.forEach(rf);sv();
 const ts=Date.now();IMP={base:D0DT,dt:label||D.dt,name:file.name,m,ts};try{localStorage.setItem('imp',JSON.stringify(IMP))}catch(e){}
 let shm='';if(SHR.db){try{await SHR.db.doc('prices/current').set({base:D0DT,dt:label||D.dt,name:file.name,ts,m});SHR.ts=ts;SHR.applied=true;shm='🌐 บันทึกราคาให้ <b>ทุกเครื่อง</b> แล้ว — เครื่องอื่นจะเห็นราคานี้เมื่อเปิดหรือรีเฟรชหน้า'}catch(e){shm='⚠️ บันทึกไว้เฉพาะ<b>เครื่องนี้</b> — บัญชีนี้ไม่มีสิทธิ์แก้ข้อมูลที่ใช้ร่วมกัน ให้เจ้าของหรือผู้แก้ไขเป็นคนนำเข้าไฟล์'}}else shm='⚠️ บันทึกไว้เฉพาะ<b>เครื่องนี้</b> — ต้องเปิดผ่านลิงก์ claude.ai และเข้าสู่ระบบ จึงจะแชร์ราคาให้ทุกเครื่องได้';
 if(label){D.dt=label;S.dt=label;$('#dt').value=label}
 D.P.forEach(rf);drawP();draw();holdNote();
 const nm=Object.keys(m).length;
 let h=`✅ นำเข้า <b>${E(file.name)}</b> แล้ว${zone?' · '+E(zone):''}${label?' · รอบ '+E(label):''}<br>ปรับราคา <b>${nm}</b> รายการ (ราคาเปลี่ยนจากเดิม ${changed.length}) · ล้างราคาที่แก้มือ ${cleared} รายการ · ในระบบแต่ไม่อยู่ในไฟล์ ${notIn} รายการ (ใช้ราคาเดิม)<br>${shm}`;
 if(label)h+=`<br>ตั้งวันที่บนป้ายเป็น <b>${E(label)}</b> แล้ว (แก้ได้ที่ช่อง "ระยะเวลาโปร")`;
 if(bad.length)h+=`<br>⚠️ ข้ามชีต: ${E(bad.join(' · '))}`;
 if(changed.length)h+=`<details><summary>รายการที่ราคาเปลี่ยน (${changed.length})</summary><div class="sc"><table><tr><th>รหัส</th><th>ชื่อสินค้า</th><th>เดิม</th><th>ใหม่</th></tr>${changed.map(x=>`<tr><td>${x.p.c}</td><td>${E(x.p.n)}</td><td>${x.prev??'-'}</td><td>${x.db}</td></tr>`).join('')}</table></div></details>`;
 if(miss.length)h+=`<details><summary>อยู่ในไฟล์แต่ยังไม่มีในระบบ (${miss.length}) — ไม่ได้เพิ่ม</summary><div class="sc"><table><tr><th>รหัส</th><th>ชื่อสินค้า</th><th>ราคาใหม่</th></tr>${miss.map(x=>`<tr><td>${x.c}</td><td>${E(x.name)}</td><td>${x.db}</td></tr>`).join('')}</table></div></details>`;
 h+=`<div style="margin-top:8px"><button class="btn g" id="imprs">↩️ กลับไปใช้ราคาเริ่มต้นของระบบ</button></div>`;
 impShow(h)}
function holdNote(){const n=$('#holdn'),parts=[],dl=u=>{const m=u.split('-');return `${+m[2]} ${THM[+m[1]-1]} ${String(+m[0]+543).slice(-2)}`};if(holdOn()){const L=HOLD.codes.map(c=>B[c]).filter(Boolean).map(p=>`${E(p.n)} <b>${p.o0??'-'}</b>${p.p0!=null&&p.p0!==p.o0?` <small style="color:var(--mu)">(ปัจจุบัน ${p.p0})</small>`:''}`);parts.push(`⏳ ใช้ <b>ราคารอบก่อนหน้า</b> ถึงวันที่ <b>${dl(HOLD.until)}</b> แล้วกลับไปใช้ราคาปัจจุบันอัตโนมัติ<br><small>${L.join(' · ')}</small>`)}if(D.dt===TEMP.round){const on=holdOn(TEMP.until),L=Object.keys(TEMP.prices).map(c=>B[c]).filter(Boolean).map(p=>on?`${E(p.n)} <b>${TEMP.prices[p.c]}</b> <small style="color:var(--mu)">(เดิม ${p.o0})</small>`:`${E(p.n)} <b>${p.o0}</b>`);parts.push(on?`💲 <b>ปรับราคาชั่วคราว</b> ถึงวันที่ <b>${dl(TEMP.until)}</b> แล้วกลับไปใช้ <b>ราคารอบก่อนหน้า</b> อัตโนมัติ<br><small>${L.join(' · ')}</small>`:`⏳ ใช้ <b>ราคารอบก่อนหน้า</b> (พ้นช่วงราคาชั่วคราว ${dl(TEMP.until)} แล้ว) · เลิกใช้เองเมื่อนำเข้าไฟล์ราคารอบใหม่<br><small>${L.join(' · ')}</small>`)}if(!parts.length){n.style.display='none';return}n.style.display='';n.innerHTML=parts.join('<hr style="border:0;border-top:1px solid var(--bd);margin:8px 0">')}
async function impReset(){D.P.forEach(p=>{p.p0=p.p1;p.o0=p.o1;p.d0=p.d1});D.dt=D0DT;D.P.forEach(rf);S.dt=D0DT;$('#dt').value=D0DT;IMP=null;try{localStorage.removeItem('imp')}catch(e){}drawP();draw();holdNote();let m2='';if(SHR.db&&SHR.cur){try{SHR.applied=false;await SHR.db.doc('prices/current').delete();m2=' · ล้างราคาที่ใช้ร่วมกันของทุกเครื่องแล้ว'}catch(e){m2=' · ⚠️ ล้างราคาที่ใช้ร่วมกันไม่ได้ (ไม่มีสิทธิ์) เครื่องอื่นยังใช้ราคาเดิม'}}impShow('↩️ กลับไปใช้ราคาเริ่มต้นของระบบแล้ว'+m2)}
$('#imp').onclick=()=>$('#impf').click();
$('#impf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';doImport(f)});
$('#impst').addEventListener('click',async e=>{const id=e.target.id;
 if(id==='imprs'){if(SHR.db&&SHR.cur&&!SHR.confirm){SHR.confirm=1;e.target.textContent='กดอีกครั้งเพื่อยืนยัน (มีผลกับทุกเครื่อง)';return}SHR.confirm=0;impReset()}

const hasF=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{if(hasF(e)){e.preventDefault();$('#dz').classList.add('on')}}));

(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use('db');if(!db)return;SHR.db=db;db.doc('prices/current').onSnapshot(onShared,()=>{})}catch(e){}})();
S.dt=D.dt;if(IMP)impShow(`ใช้ราคาจากไฟล์ที่นำเข้าไว้: <b>${E(IMP.name)}</b>${IMP.dt?' · รอบ '+E(IMP.dt):''} <button class="btn g" id="imprs" style="margin-left:8px">↩️ กลับไปใช้ราคาเริ่มต้นของระบบ</button>`);
holdNote();$('#dt').value=D.dt;$('#end').value=new Date().toISOString().slice(0,10);draw();
