const bnorm=t=>String(t||'').toLowerCase().replace(/แพ็คละ|แพ็ค|แพคละ/g,'').replace(/(\d)\s*กิโลกรัม/g,'$1kg').replace(/(\d)\s*กก\.?/g,'$1kg').replace(/(\d)\s*กรัม/g,'$1g').replace(/(\d)\s*ก\.?/g,'$1g').replace(/(\d)\s*มล\.?/g,'$1ml').replace(/(\d)\s*ลิตร/g,'$1l').replace(/[\s.\-,()\/×x*]/g,'');
const BCX={};for(const [n,b] of BCL){const k=bnorm(n);if(!(k in BCX))BCX[k]=b}
function bcFor(a){return BCX[bnorm(a.n)]||''}
function adjSave(){try{localStorage.setItem('pl_adj',JSON.stringify(ADJ))}catch(e){}}
function adjFor(c){const k=key(c).replace(/\s+/g,'');if(!k)return null;if(ALX[k])return ADJ[ALX[k]]||null;const m=/^(\d{10})([a-z]*)$/.exec(k);if(!m)return null;const a=ADJ[m[1]];if(!a)return null;const p=PD.i[k];if(p&&Math.abs(p[2]-a.o)>.001&&Math.abs(p[2]-a.p)>.001)return null;return a}
function adjList(){return Object.entries(ADJ).filter(([s,a])=>a.p!==a.o)}
function pickCode(s,a0){for(const k of SKX[s]||[]){const p=PD.i[k];if(p&&(Math.abs(p[2]-a0.o)<.001||Math.abs(p[2]-a0.p)<.001))return k}const al=Object.keys(ALX).filter(k=>ALX[k]===s);return al.find(k=>/^\d{13}$/.test(k))||al[0]||s}
function adjUI(){const L=adjList();$('adjc').textContent=L.length;$('adjn').textContent=Object.keys(ADJ).length;const mx=Object.values(ADJ).map(a=>a.sd||'').sort().pop();$('adjr').textContent=mx?'ใช้ไฟล์ปรับราคารอบวันที่ '+fdi(mx):'ยังไม่มีไฟล์ปรับราคา';
const tb=$('adjt');tb.innerHTML='';for(const [s,a] of Object.entries(ADJ)){const tr=document.createElement('tr');const up=a.p>a.o,dn=a.p<a.o;const cells=[s,a.n,money(a.o)+' → '+money(a.p),a.r||'',a.f||'',bcFor(a)||'ไม่พบชื่อ → '+s];cells.forEach((t,i)=>{const td=document.createElement('td');td.textContent=t;td.style.fontSize='12px';if(i===2)td.style.color=up?'#c0392b':dn?'#2e8b57':'inherit';tr.appendChild(td)});tb.appendChild(tr)}}
async function adjImport(files){const sm=$('scm');if(typeof XLSX==='undefined'){sm.textContent='โหลดตัวอ่าน Excel ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต) — ลองรีเฟรชหน้า';sm.style.color='#c0392b';return}
let n=0,fc=0;const inc={};
for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});let got=0;
for(const nm of wb.SheetNames){const A=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:null});
for(const r of A){const c=String(r[1]==null?'':r[1]).trim();const p=parseFloat(r[4]);if(/^\d{8,}$/.test(c)&&isFinite(p)){const o=parseFloat(r[3]);inc[c]={n:String(r[2]||'').trim(),o:isFinite(o)?o:p,p,sd:ISO(r[5]),r:String(r[7]||'').trim(),f:f.name.replace(/\.[^.]+$/,'')};got++}}}
if(got){fc++;n+=got}}catch(e){}}
if(!n){sm.textContent='ไม่พบรายการ — ต้องมีรหัสสินค้าในคอลัมน์ B และราคาใหม่ในคอลัมน์ E';sm.style.color='#c0392b';return}
Object.assign(ADJ,inc);const mx=Object.values(ADJ).map(a=>a.sd||'').sort().pop();let cut=0;for(const s in ADJ){if(ADJ[s].sd&&mx&&ADJ[s].sd<mx){delete ADJ[s];cut++}}
adjSave();buildAL();let up=0;rows.forEach(r=>{const a=adjFor(r.b);if(a&&r.p!==a.p){r.p=a.p;up++}});
adjUI();table();labels();
sm.textContent='✓ นำเข้า '+n+' รายการจาก '+fc+' ไฟล์ · รอบวันที่ '+fdi(mx)+' · ปรับราคา '+adjList().length+' รายการ'+(cut?' · ตัดรอบเก่าออก '+cut+' รายการ':'')+(up?' · อัปเดตราคาในตาราง '+up+' แถว':'');sm.style.color='#2e8b57'}

table();labels();$('cnt').textContent=rows.length+' รายการ · '+rows.length+' ป้าย';const nf=L.filter(([s,a])=>!bcFor(a)).length;sm.textContent='✓ ดึงสินค้าปรับราคาใหม่ทั้งหมด '+rows.length+' รายการ มาแสดงแล้ว'+(nf?' · ไม่พบชื่อในไฟล์บาร์โค้ด '+nf+' รายการ (ใช้รหัส Mat.Sap แทน)':'');sm.style.color='#2e8b57';

function savePM(r){const k=key(r.b);if(!k)return;const m=look(r.b);const n=(r.n||'').trim();if(!n&&!(r.p>0))return;const o={u:r.u||'PAC',p:+r.p||0};if(n&&(!m||m.name!==n))o.n=n;PM[k]=o;pmSave()}
function prod(c){const k=key(c),m=look(c),o=PM[k],a=adjFor(c);if(!m&&!o&&!a)return null;const r={name:(o&&o.n)||(m&&m.name)||(a&&a.n)||'',unit:(o&&o.u)||(m&&m.unit)||'PAC',price:(o&&o.p>0)?o.p:((m&&m.price)||0),src:(o&&!m)?'บันทึกเอง':(m?m.src:'ปรับราคา')};if(a)r.price=a.p;return r}
async function saveFile(fn,data){try{const dn=typeof claude!=='undefined'?await claude.use('downloads'):null;if(dn){await dn.save({filename:fn,data});return}}catch(e){if(e&&e.code==='declined')return}
const u=URL.createObjectURL(new Blob([data],{type:fn.endsWith('.pdf')?'application/pdf':'application/json'}));const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function look(c){c=(c||'').trim().toLowerCase().replace(/\s+/g,'');const p=PD.i[c];if(p)return{name:PD.n[p[0]],src:'PDF',unit:PD.u[p[1]],price:p[2]};const m=DB.i[c];return m?{name:DB.n[m[0]],src:m[1]}:null}

{const a=adjFor(r.b);if(a){const ok=r.p>0&&Math.abs(r.p-a.p)<.001;sp.style.color=ok?'#2e8b57':'#b9770e';sp.textContent=ok?'✓ ราคาใหม่ (เดิม '+money(a.o)+' → '+money(a.p)+')':'⚠ ราคาปรับใหม่ '+money(a.p)+' (เดิม '+money(a.o)+') ';if(!ok){const b=document.createElement('button');b.textContent='ใช้ราคาใหม่';b.onclick=()=>{r.p=a.p;savePM(r);table();labels()};sp.appendChild(b)}return}}

function buildPDF(js,W,H){const enc=new TextEncoder(),ch=[];let len=0;const off=[];
const put=x=>{const u=typeof x==='string'?enc.encode(x):x;ch.push(u);len+=u.length};
const obj=(n,f)=>{off[n]=len;put(n+' 0 obj\n');f();put('\nendobj\n')};
put('%PDF-1.4\n');const n=js.length;
obj(1,()=>put('<</Type/Catalog/Pages 2 0 R>>'));
obj(2,()=>put('<</Type/Pages/Count '+n+'/Kids['+js.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>'));
js.forEach((j,i)=>{const p=3+i*3,c='q 841.89 0 0 595.28 0 0 cm /Im0 Do Q';
obj(p,()=>put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 841.89 595.28]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
obj(p+1,()=>put('<</Length '+c.length+'>>\nstream\n'+c+'\nendstream'));
obj(p+2,()=>{put('<</Type/XObject/Subtype/Image/Width '+W+'/Height '+H+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.length+'>>\nstream\n');put(j);put('\nendstream')})});
const x=len,N=3+n*3;put('xref\n0 '+N+'\n0000000000 65535 f \n');
for(let i=1;i<N;i++)put(String(off[i]).padStart(10,'0')+' 00000 n \n');
put('trailer\n<</Size '+N+'/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
const out=new Uint8Array(len);let o=0;ch.forEach(u=>{out.set(u,o);o+=u.length});return out}
async function makePDF(){const k=300/72,W=Math.round(841.89*k),H=Math.round(595.28*k);

g.setLineDash([]);

E.slice(i,i+24).forEach((r,j)=>{const x0=GX+(j%4)*CW,y0=GY+Math.floor(j/4)*CH;
g.save();g.beginPath();g.rect(x0,y0,CW,CH);g.clip();

{const ps=money(r.p);T(ps,x0+133.4,y0+56.5,pfit(ps),'right',.2)}T('บาท/'+r.u,x0+176.5,y0+60.8,8,'right');
