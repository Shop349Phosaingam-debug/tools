<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--fg:#1a1d21;--muted:#667085;--line:#d0d5dd;--accent:#1f4e78;--warn:#fff4e5;--warnfg:#8a4b00;--bar:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#20242a;--fg:#eceff3;--muted:#98a2b3;--line:#3a4049;--accent:#6aa7de;--warn:#3a2c14;--warnfg:#f3c277}}
:root[data-theme="dark"]{--bg:#15181c;--card:#20242a;--fg:#eceff3;--muted:#98a2b3;--line:#3a4049;--accent:#6aa7de;--warn:#3a2c14;--warnfg:#f3c277}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Sarabun","Noto Sans Thai",Tahoma,Arial,sans-serif;font-size:15px}
header{padding:14px 16px 8px}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 12px;align-items:center}
button,.btn,select,input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button,.btn{cursor:pointer}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root:not([data-theme="light"]) .primary{color:#0b1520}
input[type=file]{display:none}
input[type=search]{flex:1;min-width:140px}
.count{color:var(--muted);font-size:13px;padding:0 16px 8px}
.warn{margin:0 16px 10px;padding:10px 12px;border-radius:8px;background:var(--warn);color:var(--warnfg);font-size:13px;display:none}
.warn ul{margin:6px 0 0;padding-left:18px;max-height:140px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8px;padding:0 16px 24px}
.tag{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;break-inside:avoid;page-break-inside:avoid}
.tag .nm{font-size:13px;font-weight:700;line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.tag .cd{font-size:12px;margin:2px 0}
.tag svg{max-width:100%;height:58px;width:auto}
.tag .bc{font-size:11px;color:#333}
.mode{flex:1;min-width:150px;font-weight:700}
.mode.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:root:not([data-theme="light"]) .mode.on{color:#0b1520}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:640px){.grid{--cols:1!important}}
@media print{
 :root{padding:0}
 body{background:#fff}
 header,.bar,.count,.warn,.empty{display:none!important}
 .grid{padding:0;gap:4px;grid-template-columns:repeat(var(--cols,3),1fr)!important}
 .tag{border:1px solid #000}
 @page{size:A4;margin:8mm}
}

const norm=s=>String(s==null?'':s).trim().replace(/:+$/,'').trim().replace(/\s+/g,'').toLowerCase();
let mode='count';const L={count:[],receipt:[]},S={count:new Set(),receipt:new Set()};let list=L.count,seen=S.count;
const MODE={count:{pdf:'count-tag.pdf',kind:'ชิ้น',sub:'Count Tag: แสดงชื่อสินค้า รหัสสินค้า และแถบบาร์โค้ดระดับชิ้น · เพิ่มไฟล์รายการสินค้าได้ (.xlsx / .xls / .csv)'},receipt:{pdf:'goods-receipt.pdf',kind:'ลัง',sub:'ใบรับสินค้า: แสดงชื่อสินค้า รหัสสินค้า และแถบบาร์โค้ดระดับลัง · เพิ่มไฟล์ใบรับสินค้าได้ (.xlsx / .xls) อ่านชื่อจากคอลัมน์ รายการสินค้า'}};
const $=id=>document.getElementById(id);
function add(code,name){
  const hit=DB[norm(name)];if(!hit)return 'nomatch';
  const bcs=mode==='count'?hit[1]:(hit[2]?[hit[2]]:[]);if(!bcs.length)return 'nobc';
  for(const bc of bcs){const key=(code||'')+'|'+bc;if(seen.has(key))continue;seen.add(key);
    list.push({code:code||'',name:hit[0],bc:bc})}
  return 'ok';
}
function why(st,nm){nm=String(nm).trim().replace(/:+$/,'');return st==='nobc'?nm+' (ไม่มีบาร์โค้ด'+MODE[mode].kind+')':nm+' (ไม่พบในฐานข้อมูล)'}
function showMiss(miss){const w=$('warn');if(!miss.length){w.style.display='none';return}
  w.style.display='block';w.textContent='ไม่ได้เพิ่ม '+miss.length+' รายการ:';
  const ul=document.createElement('ul');miss.slice(0,200).forEach(m=>{const li=document.createElement('li');li.textContent=m;ul.appendChild(li)});w.appendChild(ul)}
function parseRows(rows){
  const miss=[];let hr=-1,nc=-1,cc=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i]||[];
    const n=r.findIndex(v=>/^(ชื่อสินค้า|รายการสินค้า)$/.test(String(v).trim()));
    if(n>=0){hr=i;nc=n;const c=r.findIndex(v=>/^(รหัสสินค้า|รหัส)$/.test(String(v).trim()));cc=c;break}}
  for(let i=hr+1;i<rows.length;i++){const r=rows[i]||[];
    if(hr>=0){const nm=r[nc];if(!nm||!String(nm).trim()||/^\s*รวม/.test(String(nm)))continue;
      const st=add(cc>=0?String(r[cc]||'').trim():'',nm);if(st!=='ok')miss.push(why(st,nm))}
    else{ // no header: find a cell that matches DB name
      let ok=false,code='';
      for(const v of r){if(v!==''&&DB[norm(v)]){const st=add(code,v);if(st!=='ok')miss.push(why(st,v));ok=true;break}}
      if(!ok){const t=r.find(v=>String(v).trim().length>3&&isNaN(Number(v)));if(t&&i>0)miss.push(why('nomatch',t))}}
  }return miss;
}
const handleFiles=async e=>{
  let miss=[];
  for(const file of e.target.files){
    try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
      for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false});miss=miss.concat(parseRows(rows))}
    }catch(err){miss.push('อ่านไฟล์ไม่ได้: '+file.name)}
  }
  showMiss(miss);render();e.target.value='';
};
$('f').addEventListener('change',handleFiles);
function draw(svg,bc){
  const opt={displayValue:false,height:58,margin:0,width:1.6};
  try{ if(/^\d{13}$/.test(bc)) JsBarcode(svg,bc,Object.assign({format:'EAN13'},opt)); else throw 0 }
  catch(_){ try{JsBarcode(svg,bc,Object.assign({format:'CODE128'},opt))}catch(__){} }
}
function render(){
  const g=$('grid');g.textContent='';const q=norm($('q').value);
  const vis=list.filter(x=>!q||norm(x.name).includes(q)||x.code.toLowerCase().includes(q)||x.bc.toLowerCase().includes(q));
  $('count').textContent='แสดง '+vis.length+' จาก '+list.length+' รายการ';
  if(!vis.length){const d=document.createElement('div');d.className='empty';d.textContent='ไม่มีรายการ – กด "+ เพิ่มไฟล์รายการสินค้า"';g.appendChild(d);return}
  const fr=document.createDocumentFragment();
  vis.forEach(x=>{const t=document.createElement('div');t.className='tag';
    const nm=document.createElement('div');nm.className='nm';nm.textContent=x.name;
    const cd=document.createElement('div');cd.className='cd';cd.textContent=x.code?('รหัส '+x.code):'';
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    const b=document.createElement('div');b.className='bc';b.textContent=x.bc;
    t.append(nm,cd,svg,b);fr.appendChild(t);draw(svg,x.bc)});
  g.appendChild(fr);
}
$('q').addEventListener('input',render);
$('clear').onclick=()=>{list.length=0;seen.clear();showMiss([]);render()};
function setMode(m){mode=m;list=L[m];seen=S[m];$('m-count').classList.toggle('on',m==='count');$('m-receipt').classList.toggle('on',m==='receipt');$('sub').textContent=MODE[m].sub;showMiss([]);render()}
$('m-count').onclick=()=>setMode('count');$('m-receipt').onclick=()=>setMode('receipt');
$('cols').onchange=()=>document.documentElement.style.setProperty('--cols',$('cols').value);

const FONT='Sarabun,"Noto Sans Thai",Tahoma,Arial,sans-serif';
function barcodeImg(bc){return new Promise(res=>{
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');draw(svg,bc);
  const xml=new XMLSerializer().serializeToString(svg);
  const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)})}
function wrap(ctx,text,maxW){const lines=[];let cur='';for(const ch of text){if(ctx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch}else cur+=ch}if(cur)lines.push(cur);return lines}
async function tagCanvas(x,W,H){
  const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
  ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='top';
  const pad=W*0.05;let fs=H*0.115,lines;
  do{ctx.font='bold '+fs+'px '+FONT;lines=wrap(ctx,x.name,W-2*pad);if(lines.length<=2)break;fs*=0.92}while(fs>H*0.06);
  let y=H*0.06;lines.slice(0,2).forEach(l=>{ctx.fillText(l,W/2,y);y+=fs*1.2});
  y=H*0.06+fs*2.4+H*0.01;
  if(x.code){ctx.font=(H*0.09)+'px '+FONT;ctx.fillText('รหัส '+x.code,W/2,y)}
  y+=H*0.11;
  const bh=H*0.30,im=await barcodeImg(x.bc);
  if(im){const r=Math.min((W-2*pad)/im.width,bh/im.height);const w=im.width*r,h=im.height*r;ctx.drawImage(im,(W-w)/2,y,w,h)}
  ctx.font=(H*0.08)+'px '+FONT;ctx.fillText(x.bc,W/2,y+bh+H*0.02);
  return c}
$('pdf').onclick=async()=>{
  const btn=$('pdf');
  const q=norm($('q').value);
  const vis=list.filter(x=>!q||norm(x.name).includes(q)||x.code.toLowerCase().includes(q)||x.bc.toLowerCase().includes(q));
  if(!vis.length){alert('ไม่มีรายการ');return}
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(_){dl=null}
  const txt=btn.textContent;btn.disabled=true;
  try{
    const cols=+$('cols').value,M=8,G=3,PW=210,PH=297,tw=(PW-2*M-G*(cols-1))/cols,th=cols===4?34:cols===3?36:40;
    const rows=Math.floor((PH-2*M+G)/(th+G)),per=cols*rows,pxmm=10;
    const doc=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    for(let i=0;i<vis.length;i++){
      btn.textContent='กำลังสร้าง '+(i+1)+'/'+vis.length;
      if(i&&i%per===0)doc.addPage();
      const k=i%per,col=k%cols,row=Math.floor(k/cols);
      const c=await tagCanvas(vis[i],Math.round(tw*pxmm),Math.round(th*pxmm));
      doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M+col*(tw+G),M+row*(th+G),tw,th);
      if(i%10===9)await new Promise(r=>setTimeout(r,0));
    }
    const blob=doc.output('blob');
    if(!dl){alert('หน้านี้ยังบันทึกไฟล์ไม่ได้ในมุมมองนี้ ลองเปิดจากหน้า claude.ai โดยตรง');return}
    await dl.save({filename:MODE[mode].pdf,data:blob});
  }catch(e){if(!e||e.code!=='declined')alert('สร้าง/บันทึก PDF ไม่สำเร็จ'+(e&&e.message?': '+e.message:''))}
  finally{btn.disabled=false;btn.textContent=txt}
};
document.documentElement.style.setProperty('--cols',3);
setMode('count');
</script></body></html>
